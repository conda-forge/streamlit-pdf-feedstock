schema_version: 1

context:
  version: "2.1.0"

package:
  name: streamlit-pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-pdf/streamlit_pdf-${{ version }}.tar.gz
  sha256: 2e2a79140335087517e83b024277750fb910d61fd24052d886c0def4f856fc2d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - wheel
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - streamlit_pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Streamlit component for viewing PDF files
  license: Apache-2.0 AND MIT AND BSD-3-Clause
  license_file:
    - LICENSE
    - NOTICES
    - streamlit_pdf/frontend/build/assets/cmaps/LICENSE
    - streamlit_pdf/frontend/build/assets/standard_fonts/LICENSE_FOXIT
    - streamlit_pdf/frontend/build/assets/standard_fonts/LICENSE_LIBERATION
  homepage: https://streamlit.io

extra:
  recipe-maintainers:
    - FlorianFlatscher
